  <script>
    window.festivalGetNotificationPermission = function () {
      if (!('Notification' in window)) {
        return 'unsupported';
      }
      return Notification.permission;
    };

    window.festivalRequestPushToken = async function (vapidKey, shouldRequestPermission) {
      if (!('Notification' in window)) {
        throw new Error('unsupported-browser: Notification API is not available');
      }
      if (!('serviceWorker' in navigator)) {
        throw new Error('unsupported-browser: Service Worker API is not available');
      }
      if (!window.firebase || !firebase.messaging) {
        throw new Error('firebase-sdk-missing: firebase messaging compat SDK was not loaded');
      }

      var supported = await firebase.messaging.isSupported();
      if (!supported) {
        throw new Error('unsupported-browser: Firebase Messaging is not supported here');
      }

      if (Notification.permission !== 'granted') {
        if (!shouldRequestPermission) {
          throw new Error('permission-' + Notification.permission);
        }
        var permission = await Notification.requestPermission();
        if (permission !== 'granted') {
          throw new Error('permission-' + permission);
        }
      }

      if (!firebase.apps.length) {
        firebase.initializeApp(window.festivalFirebaseConfig);
      }

      var registration = await (window.festivalMessagingWorkerReady ||
        navigator.serviceWorker.register('/firebase-messaging-sw.js'));
      var messaging = firebase.messaging();
      var token = await messaging.getToken({
        vapidKey: vapidKey,
        serviceWorkerRegistration: registration,
      });
      if (!token) {
        throw new Error('empty-token');
      }
      return token;
    };
  </script>
  <script>
    (function () {
      function loadFlutter() {
        var script = document.createElement('script');
        script.src = 'flutter_bootstrap.js';
        script.async = true;
        document.body.appendChild(script);
      }

      if (!('serviceWorker' in navigator)) {
        loadFlutter();
        return;
      }

      window.festivalMessagingWorkerReady = navigator.serviceWorker
        .register('/firebase-messaging-sw.js')
        .catch(function (error) {
          console.warn('[FESTIVAL_PUSH] messaging worker registration failed', error);
        })
        .finally(loadFlutter);
    })();
  </script>
