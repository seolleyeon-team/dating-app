title = "seolleyeon gitleaks"

[extend]
useDefault = true

[allowlist]
description = "Client Firebase configs and known test fixtures"
paths = [
  '''android/app/google-services.json''',
  '''ios/Runner/GoogleService-Info.plist''',
  '''lib/firebase_options.dart''',
  '''test/auth_service_diagnostics_test.dart''',
  # Public client configuration and SDK identifiers. These files do not hold
  # server credentials; the values are required by the client-side SDKs.
  '''festival_web/web/firebase-messaging-sw.js''',
  '''festival_web/web/index.html''',
  '''lib/main.dart''',
  '''lib/services/auth_service.dart''',
  # Dependency lockfile checksums are not credentials.
  '''ios/Podfile.lock''',
  # Deterministic test fixture identifiers are not credentials.
  '''test/features/meeting_icebreaker/meeting_icebreaker_domain_test.dart''',
  '''tmp/.*''',
]
