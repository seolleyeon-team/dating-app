name: ci

on:
  push:
    branches: [main, "audit/**", "release/**", semisemifinal]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  functions:
    name: Functions build/lint/test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test

  rules:
    name: Firestore rules tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: rules_tests/package-lock.json
      - run: npm ci
        working-directory: rules_tests
      - run: npx --yes firebase-tools@13 emulators:exec --only firestore --project seolleyeon-rules-test "npm --prefix rules_tests test"
        env:
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080

  storage-rules:
    name: Storage rules tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: rules_tests/package-lock.json
      - run: npm ci
        working-directory: rules_tests
      - run: npx --yes firebase-tools@13 emulators:exec --only storage --project seolleyeon-storage-rules-test "npm --prefix rules_tests run test:storage"
        env:
          FIREBASE_STORAGE_EMULATOR_HOST: 127.0.0.1:9199
          STORAGE_EMULATOR_HOST: 127.0.0.1:9199

  flutter:
    name: Flutter analyze/test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          # 릴리스 검증 기준 SDK. floating stable 은 formatter/analyzer/위젯
          # assertion 이 바뀌면서 로컬과 다른 결과를 내므로 고정한다.
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

  android-debug:
    name: Android debug APK smoke build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          # 릴리스 검증 기준 SDK. floating stable 은 formatter/analyzer/위젯
          # assertion 이 바뀌면서 로컬과 다른 결과를 내므로 고정한다.
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      # applicationId 는 flavor 가 정하므로 flavor 없는 빌드는 성립하지 않는다.
      # Play 에 나가는 패키지가 production 이므로 그쪽을 먼저 확인하고,
      # staging 도 함께 돌려 개발용 flavor 가 조용히 깨지지 않게 한다.
      - run: flutter build apk --debug --flavor production
      - run: flutter build apk --debug --flavor staging

  android-production-release:
    name: Android production AAB compile smoke (CI throwaway key)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      # 목적: 스토어에 실제로 나가는 산출물(release AAB)의 컴파일/R8/리소스/
      # 패키징 검증. build.gradle.kts 는 key.properties 없는 release 빌드를
      # fail-closed 로 거부하므로(sec04 keystore hardening), CI 는 업로드에
      # 쓸 수 없는 일회용 keystore 를 즉석 생성해 컴파일만 검증한다.
      # 실제 서명은 로컬 릴리스 절차의 진짜 keystore 로만 수행한다.
      - name: Generate throwaway CI keystore (compile smoke only)
        run: |
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/ci-smoke.jks" \
            -storepass ci-smoke-passphrase -keypass ci-smoke-passphrase \
            -alias ci-smoke -keyalg RSA -keysize 2048 -validity 1 \
            -dname "CN=ci-smoke, OU=ci, O=ci, L=ci, S=ci, C=KR"
          {
            echo "storeFile=$RUNNER_TEMP/ci-smoke.jks"
            echo "storePassword=ci-smoke-passphrase"
            echo "keyAlias=ci-smoke"
            echo "keyPassword=ci-smoke-passphrase"
          } > android/key.properties
      - run: flutter build appbundle --flavor production --release

  web-build:
    name: Web build smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          # 릴리스 검증 기준 SDK. floating stable 은 formatter/analyzer/위젯
          # assertion 이 바뀌면서 로컬과 다른 결과를 내므로 고정한다.
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter build web --release

  python-recsys:
    name: Recsys / script unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install pytest
          # B3-L13: the frozen verifier recipe is a scikit-learn logistic regression; CI tests fit it on tiny synthetic vectors (no model, no image).
          pip install "scikit-learn==1.9.1"
          if [ -f recsys/requirements.txt ]; then pip install -r recsys/requirements.txt || true; fi
      - run: pytest -q tests/test_avatar_exact_replay_auth.py --maxfail=10
      - run: pytest -q recsys/tests --maxfail=20
        env:
          PYTHONPATH: .
      # 추천 정책(생활권·차단·학교) 회귀는 CI에서도 막아야 한다.
      - run: pytest -q tests/test_rec_policy_and_blocks.py tests/test_recsys_policy_args.py --maxfail=20
        env:
          PYTHONPATH: .
      # 아바타 워커 이미지가 Cloud Run 리전(asia-southeast1) 밖으로 push 되면
      # 콜드스타트마다 리전 간 pull 이 과금된다. 빌드 설정 회귀를 CI 에서 막는다.
      - run: pytest -q tests/test_avatar_build_region_guard.py --maxfail=10
        env:
          PYTHONPATH: .
      # 후보 생성은 건당 유료다. max4 는 워커 실행 1회가 아니라 job 생애 전체에
      # 걸린 상한이어야 하고, 재배달·retention 만료·crash·동시 배달에서도
      # 유지돼야 한다. 비용 회귀를 CI 에서 막는다.
      - run: pytest -q tests/test_avatar_max4_paid_generation_safety.py --maxfail=10
        env:
          PYTHONPATH: .
      # fidelity 기록은 실제로 적용된 calibration 권위를 말해야 하고, 그 기록
      # 추가가 결정을 바꿔서는 안 된다. provenance 와 decision-diff 가드를
      # 함께 고정한다.
      - run: pytest -q tests/test_avatar_fidelity_provenance.py --maxfail=10
        env:
          PYTHONPATH: .
      # calibration 은 artifact / env triple / none 세 갈래로 풀리는데, 실패한
      # artifact 가 "설정 안 됨" 과 똑같이 조용한 None 으로 떨어졌다. 어느 갈래가
      # 답했는지와 fail-closed 계약을 고정한다.
      - run: pytest -q tests/test_avatar_calibration_authority.py --maxfail=10
        env:
          PYTHONPATH: .
      # 보고되지 않은 신호를 "unavailable" 로 적어 두면 preview_policy 와
      # adaptive_generation 이 그걸 실제 장애로 읽는다. dino 가 그랬고
      # mediapipe 도 같은 모양인 채 남아 있었다. 그리고 face detector 가 죽었을
      # 때 OD 가 본 1인이 secondary person hard reject 로 둔갑하면 안 된다.
      # required 신호는 여전히 fail-closed 라는 것까지 함께 고정한다.
      - run: pytest -q tests/test_avatar_outage_semantics_contract.py --maxfail=10
        env:
          PYTHONPATH: .
      # availability 판단 authority가 preview_policy / adaptive_generation /
      # worker 세 곳에 각각 구현돼 있으면 반드시 갈라진다. worker gate 는
      # top-level qa.modelAvailability 를 읽어 프로덕션 298/298 에서 빈 dict
      # 를 스캔하고 있었다(우연히 inert). 하나의 resolver 를 세 consumer 가
      # 공유한다는 것과 planner/worker 가 반대로 답하지 않는다는 것을 고정한다.
      - run: pytest -q tests/test_avatar_worker_availability_authority.py --maxfail=10
        env:
          PYTHONPATH: .
      # Python 의 hard-reject 의미론과 TypeScript 승인 게이트가 갈라지면
      # QA 가 거부한 후보가 approved avatar 가 될 수 있다. 공유 계약
      # functions/src/avatarQaHardRejectContract.json 을 양쪽이 각각
      # 실행해서 검증한다(TS 쪽은 npm test 가 돌린다).
      - run: pytest -q tests/test_avatar_qa_hard_reject_parity.py --maxfail=10
        env:
          PYTHONPATH: .
      # QA 가 실제로 잰 숫자가 문서를 못 넘어가면 다음 calibration 은 근거가
      # 0 이다. CLIP raw score / 보류된 canonical identity score 의 사유 /
      # shadow OCR 이 PII 없이 살아남는지, 그리고 그 기록 추가가 결정을 전혀
      # 바꾸지 않는지(decision diff = 0)를 함께 고정한다.
      - run: pytest -q tests/test_avatar_measurement_observability.py --maxfail=10
        env:
          PYTHONPATH: .
      # identity 비교의 source 쪽은 사진 전체, candidate 쪽은 얼굴 crop 이라
      # 두 숫자가 같은 양이 아니다. 대칭 crop 점수는 shadow 로만 재고,
      # 기존 asymmetric 점수/threshold/결정은 그대로라는 것을 고정한다.
      # shadow 에 threshold 가 생기면 이 테스트가 깨져야 한다.
      - run: pytest -q tests/test_avatar_symmetric_identity_shadow.py --maxfail=10
        env:
          PYTHONPATH: .
      # 같은 config 상수를 읽는다는 것만으로는 "같은 crop"이 증명되지 않는다.
      # 실제 HeadShouldersCropper 를 호출해 만든 기대값과 pixel 단위로 비교한다.
      - run: pytest -q tests/test_avatar_identity_crop_parity.py --maxfail=10
        env:
          PYTHONPATH: .
      # 2026-09-10: 실행 리전/레지스트리는 맞았는데 source staging 만 US
      # 멀티리전 버킷으로 갔다. --default-buckets-behavior 가 빠졌기 때문인데
      # 그 플래그는 cloudbuild YAML 로 표현할 수 없고 builds describe 에도
      # 안 남는다. 레시피를 기억에 맡기지 않고 계약으로 고정한다.
      - run: pytest -q tests/test_avatar_build_recipe_contract.py --maxfail=10
        env:
          PYTHONPATH: .
      # B3: watermark/text/logo 계약 테스트가 CI 에 하나도 없었다. 게다가
      # test_avatar_visual_risk / test_avatar_ocr_shadow_confidence 가 먼저
      # 수집되면 avatar_generation 을 non-package stub 으로 심어서 나머지 4개가
      # 'not a package' 로 collection error 가 났다(전체 tests/ 실행에서는
      # 알파벳 순서 덕에 가려져 있었다). 그 두 파일을 일부러 맨 앞에 둬서
      # 순서 의존이 다시 생기면 CI 가 잡게 한다.
      - run: pytest -q tests/test_avatar_visual_risk.py tests/test_avatar_ocr_shadow_confidence.py tests/test_avatar_watermark_construct_validity.py tests/test_avatar_watermark_decision.py tests/test_avatar_watermark_evidence_authority.py tests/test_avatar_watermark_product_contract.py tests/test_avatar_watermark_contract_report.py tests/test_avatar_watermark_benchmark.py --maxfail=10
        env:
          PYTHONPATH: .
      # B3-L1: 사용자 데이터 없이 그린 known control 이미지. 결정적이고,
      # 네트워크를 쓰지 않고, 라벨이 schema v2 의 human image label 이며,
      # manifest 가 production prevalence 추정 금지를 명시한다는 것을 고정한다.
      - run: pytest -q tests/test_avatar_watermark_controls.py --maxfail=10
        env:
          PYTHONPATH: .
      # B3-L4: Florence model-ceiling benchmark. Florence weights 와 G004 이미지는
      # CI 에 없으므로 추론은 로컬에서만 돈다. 여기서는 derivative 결정성, 두
      # authorized set 개수, 원본 불변, raw OCR/파일명/경로 비유출, model miss 와
      # policy miss 분리, H1 shadow-only, 도메인별 집계를 고정한다.
      - run: pytest -q tests/test_avatar_florence_ceiling.py --maxfail=10
        env:
          PYTHONPATH: .
      # B3-L5: H2 single-overlay shadow. escalate-only 라서 hard-reject bypass /
      # overlay miss / artifact miss 증가가 구조적으로 0 이어야 하고, pre-registration
      # 문서와 코드가 같이 움직여야 한다. 모델/이미지 없이 로직만 고정한다.
      - run: pytest -q tests/test_avatar_single_overlay_shadow.py --maxfail=10
        env:
          PYTHONPATH: .
      # B3-L5 Part B: logo detector benchmark 는 가중치와 G004 이미지가 CI 에 없으므로
      # 추론은 로컬 전용이다. 후보 pin/license, ground-truth 매칭, clean 이미지가
      # false positive 로 집계되지 않는다는 것, privacy 가드만 CI 에서 고정한다.
      - run: pytest -q tests/test_avatar_logo_detector_benchmark.py --maxfail=10
        env:
          PYTHONPATH: .
      # B3-L6: 사람 라벨링 UI 는 network 0 / opaque ID / detector 예측 비노출이어야
      # 하고, 두 rater 독립성과 라벨 필드 allowlist 가 깨지면 안 된다. H3 는
      # escalate-only 라 hard-reject bypass 와 miss 증가가 구조적으로 0,
      # H3-C 는 human 필드를 요구하므로 runtime rule 이 될 수 없다는 것까지 고정.
      # 모델 추론·사람 라벨·사용자 이미지는 CI 에 없다.
      - run: pytest -q tests/test_avatar_detector_assisted_shadow.py --maxfail=10
        env:
          PYTHONPATH: .
      # B3-L6.2: threshold selection 은 development 만 읽고 holdout 은 한 번만,
      # H4-DIRECT-1 은 Florence region 없이도 escalate-only, human 필드는 runtime
      # 입력 불가, precision 미정의는 통과 불가, 동일 라벨 내용은 사기가 아님.
      - run: pytest -q tests/test_avatar_owlv2_threshold_selection.py --maxfail=10
        env:
          PYTHONPATH: .
      # B3-L7: gate V2 는 v1 과 별개 버전, 결정적 challenge 렌더링·원본 불변·실상표 금지·
      # dev/holdout 격리·holdout 1회·clean specificity 와 positive sensitivity 분리를 고정.
      # 모델 추론·사용자 이미지는 CI 에 없다.
      - run: pytest -q tests/test_avatar_owlv2_challenge_v2.py --maxfail=10
        env:
          PYTHONPATH: .
      # B3-L8: dual-channel V3 는 v1/v2 와 별개 버전. Channel T 는 raw OCR 존재가 아니라
      # canonical policy action, Channel G 는 0.25 고정 review-only, 합성은 max severity
      # escalate-only. human/family/groundTruth 필드는 runtime 입력 불가, exact reuse 는
      # spec+pixel 동일성 증명 필요, holdout 은 dev pass 이후 1회. 모델·이미지·라벨은 CI 에 없다.
      - run: pytest -q tests/test_avatar_dual_channel_v3.py --maxfail=10
        env:
          PYTHONPATH: .
      # B3-L9: TEXT_POLICY_SHADOW_V1 은 canonical typed evidence 위의 review-only supplement.
      # raw OCR 존재만으로 발동 불가, raw 문자열·human·family·groundTruth·confidenceBand 는 predicate 입력 불가,
      # candidate 순서 고정·가장 strict 한 eligible 선택, holdout 은 freeze 이후 1회, N=8 에서 1/8 clean 은 실패.
      - run: pytest -q tests/test_avatar_text_policy_shadow.py --maxfail=10
        env:
          PYTHONPATH: .
      # B3-L10A: Florence beam sequence score 는 UNCALIBRATED DISCRIMINATION FEATURE. region confidence 로
      # 흘러가지 않고 confidenceBand 는 unknown 유지, whole_sequence 는 region score 로 가장 불가, score 로
      # watermark action 변경 불가, validation 은 freeze 이후 1회·이미 본 값이면 NEW_HELDOUT_REQUIRED.
      - run: pytest -q tests/test_avatar_ocr_score_separability.py --maxfail=10
        env:
          PYTHONPATH: .
      # B3-L10B: score+outputTokenCount 2-feature 는 uncalibrated 그대로, L10A threshold 9개 verbatim 재사용·coarse cap 고정,
      # geometry/human/family 입력 거부, dual-feature exposure audit 없이는 validation 불가, 1회 lock, robustness 는 rule 튜닝 불가.
      - run: pytest -q tests/test_avatar_ocr_two_feature.py --maxfail=10
        env:
          PYTHONPATH: .
      # B3-L11: VISUAL_MARK_CHALLENGE_V3 + DETECTOR_CANDIDATE_SET_V1. 실상표 거부, DEV/HOLDOUT variant 분리, alpha/size/placement 고정,
      # 렌더 결정성, OWLv2 0.25/prompt 불변, YOLO-World 제외, cross-model score 금지, review-only, holdout freeze+1회, LOW alpha 별도 보고.
      - run: pytest -q tests/test_avatar_visual_mark_detector.py --maxfail=10
        env:
          PYTHONPATH: .
      # B3-L12A: Grounding DINO box-geometry filter (area/aspect only) at frozen 0.25; label/human/family/GT 입력 거부,
      # positive box 는 후보 freeze 전 접근 불가, 후보 ≤4·순서 고정·미세 탐색 금지, review-only, B3-L11 holdout 1회 lock 재사용.
      - run: pytest -q tests/test_avatar_gdino_geometry_filter.py --maxfail=10
        env:
          PYTHONPATH: .
      # B3-L13: frozen 3-detector proposal union + local CLIP crop verifier (fixed L2 logistic). coverage gate 선행, GT/human/family/face 입력 거부,
      # base-disjoint group OOF, in-sample 선택 불가, hyperparameter/crop/grid 고정, ambiguous 제외, review-only, B3-L11 holdout 1회 lock.
      - run: pytest -q tests/test_avatar_proposal_verifier.py --maxfail=10
        env:
          PYTHONPATH: .
      # B3-L14A: EDGE_MARK_GENERALIZATION_V1 — frozen 3-generator union의 edge proposal ceiling(4 edge × 2 size × 2 geometry, OPAQUE),
      # B3-L13 verdict/EDGE critical 불변, diagnostic 강등·verifier 실행 금지, construct freeze 후에만 old-miss audit, per-cell 11/12·8/8 산술,
      # holdout 1회 lock, B3-L11 원 holdout 미접촉, aggregate-only.
      - run: pytest -q tests/test_avatar_edge_mark_generalization.py --maxfail=10
        env:
          PYTHONPATH: .
      # B3-L15A: deterministic edge-scan proposal channel (EDGE_SCAN_PROPOSAL_V1, tile 0.16·min, spacing ≤ 0.09·min, GT coverage ≥ 0.95) + frozen union
      # + local CLIP verifier (B3-L13 recipe). zero-shot threshold/prompt 불변, scan 은 image dimension 만, ceiling gate 선행, base-disjoint OOF 만 선택,
      # 12 clean burden gate, broad + B3-L14A edge cell gate, known-construct stress ≠ holdout, B3-L11 원 holdout 은 stress pass 후 1회 lock, aggregate-only.
      - run: pytest -q tests/test_avatar_edge_scan_verifier.py --maxfail=10
        env:
          PYTHONPATH: .
      # B3-L16A: B3-L15A proposal architecture 그대로(EDGE_SCAN_PROPOSAL_CONTRACT_FROZEN_AFTER_B3_L15A) + 유일한 새 가설 = CLIP → facebook/dinov2-base
      # (pinned revision, 공식 preprocessor, pooler_output CLS, L2) 교체. 후보 1개·비선형 head 금지·layer/pooling search 금지, 같은 crop/label/fold/
      # linear recipe/grid, OOF 만 선택, stress ≠ holdout, B3-L11 원 holdout 1회, dev 실패 시 representation search stop rule.
      - run: pytest -q tests/test_avatar_dinov2_verifier.py --maxfail=10
        env:
          PYTHONPATH: .
      # B3-L17A: SUPERVISED_WATERMARK_LOGO_DATASET_V1 data-design contract only (no training/inference): source policy, ontology(B3 authority),
      # region schema, blinded dual-rater workflow, group leakage unit, sha256+pHash dedup, deterministic group-disjoint split, sealed-test lock,
      # Clopper-Pearson sufficiency helper(29/46/59), legacy contamination classification, aggregate-only artifacts.
      - run: pytest -q tests/test_avatar_supervised_dataset_contract.py --maxfail=10
        env:
          PYTHONPATH: .
      # 배포 가드는 Windows 운영자 셸에서 Hangul env 값을 "???" 로 읽어 바뀐 적
      # 없는 변수를 changed 로 보고했다. 인코딩과 키 단위 승인 계약을 Linux
      # 에서도 고정한다.
      - run: pytest -q tests/test_functions_env_regression_guard.py tests/test_functions_env_guard_cross_platform.py tests/test_functions_env_guard_exact_key_auth.py --maxfail=10
        env:
          PYTHONPATH: .

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    env:
      # 공식 OSS CLI 를 고정 버전으로 쓴다. gitleaks-action 은 조직 저장소에서
      # 라이선스 키를 요구해 스캔이 아예 실행되지 않았다.
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - uses: actions/checkout@v4
        with:
          # 전체 history 를 스캔하려면 얕은 클론으로는 안 된다.
          fetch-depth: 0
      - name: Install gitleaks CLI
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -fsSL "$base/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          curl -fsSL "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o /tmp/gitleaks-checksums.txt
          # 공식 manifest 와 대조해 통과할 때만 설치한다.
          expected="$(awk -v f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" '$2 == f {print $1}' /tmp/gitleaks-checksums.txt)"
          actual="$(sha256sum /tmp/gitleaks.tar.gz | awk '{print $1}')"
          if [ -z "$expected" ] || [ "$expected" != "$actual" ]; then
            echo "gitleaks checksum verification failed" >&2
            exit 1
          fi
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          installed="$(gitleaks version)"
          if [ "$installed" != "$GITLEAKS_VERSION" ]; then
            echo "gitleaks version mismatch: $installed != $GITLEAKS_VERSION" >&2
            exit 1
          fi
      - name: Scan full git history
        # 값은 --redact 로 가리고 위치만 남긴다. finding 이 있으면 non-zero 로 끝난다.
        run: gitleaks git --config .gitleaks.toml --redact --verbose .
