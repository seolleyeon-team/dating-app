name: ci

on:
  push:
    branches: [main, "audit/**", "release/**", semisemifinal]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  functions:
    name: Functions build/lint/test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test

  rules:
    name: Firestore rules tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: rules_tests/package-lock.json
      - run: npm ci
        working-directory: rules_tests
      - run: npx --yes firebase-tools@13 emulators:exec --only firestore --project seolleyeon-rules-test "npm --prefix rules_tests test"
        env:
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080

  storage-rules:
    name: Storage rules tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: rules_tests/package-lock.json
      - run: npm ci
        working-directory: rules_tests
      - run: npx --yes firebase-tools@13 emulators:exec --only storage --project seolleyeon-storage-rules-test "npm --prefix rules_tests run test:storage"
        env:
          FIREBASE_STORAGE_EMULATOR_HOST: 127.0.0.1:9199
          STORAGE_EMULATOR_HOST: 127.0.0.1:9199

  flutter:
    name: Flutter analyze/test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

  android-debug:
    name: Android debug APK smoke build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --debug

  web-build:
    name: Web build smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build web --release

  python-recsys:
    name: Recsys / script unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install pytest
          if [ -f recsys/requirements.txt ]; then pip install -r recsys/requirements.txt || true; fi
      - run: pytest -q tests/test_avatar_exact_replay_auth.py --maxfail=10
      - run: pytest -q recsys/tests --maxfail=20
        env:
          PYTHONPATH: .
      # 추천 정책(생활권·차단·학교) 회귀는 CI에서도 막아야 한다.
      - run: pytest -q tests/test_rec_policy_and_blocks.py tests/test_recsys_policy_args.py --maxfail=20
        env:
          PYTHONPATH: .

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
