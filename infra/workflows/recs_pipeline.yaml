# ==========================================================
# Seolleyeon Recommendation Pipeline - Cloud Workflows
#
# Flow:
#   1. export        (recEvents → GCS CSV)
#   2. clip/svd/knn  (parallel, train + Firestore export)
#   3. rrf           (merge all sources)
#   4. verify        (1:1 health check, non-fatal)
#   5. meeting group-index -> recommend -> daily -> strict verify
#
# Trigger: Cloud Scheduler (daily 04:00 KST)
# Input (optional):
#   { "date_key": "20260309", "bucket": "seolleyeon-final-recs" }
# ==========================================================

main:
  params: [input]
  steps:
    # --------------------------------------------------
    # 0. Init variables
    # --------------------------------------------------
    - init:
        assign:
          - project_id: '${sys.get_env("GOOGLE_CLOUD_PROJECT_ID")}'
          - region: "asia-northeast3"
          - bucket: '${default(map.get(input, "bucket"), project_id + "-recs")}'
          - date_key: '${default(map.get(input, "date_key"), text.replace_all(text.substring(time.format(sys.now(), "Asia/Seoul"), 0, 10), "-", ""))}'

    - log_start:
        call: sys.log
        args:
          data: '${"Pipeline started — project=" + project_id + " date_key=" + date_key + " bucket=" + bucket}'
          severity: "INFO"

    # --------------------------------------------------
    # 1. Export recEvents → GCS CSV
    # --------------------------------------------------
    - run_export:
        try:
          call: googleapis.run.v2.projects.locations.jobs.run
          args:
            name: '${"projects/" + project_id + "/locations/" + region + "/jobs/recs-export"}'
            body:
              overrides:
                containerOverrides:
                  - args:
                      - "--step=export"
                      - '${"--date-key=" + date_key}'
                      - '${"--project=" + project_id}'
                      - '${"--bucket=" + bucket}'
          result: export_result
        except:
          as: e
          steps:
            - log_export_fail:
                call: sys.log
                args:
                  data: '${"Export failed: " + json.encode_to_string(e)}'
                  severity: "ERROR"
            - raise_export:
                raise: '${e}'

    - log_export_done:
        call: sys.log
        args:
          data: "Export completed"
          severity: "INFO"

    # --------------------------------------------------
    # 2. CLIP / SVD / KNN  (parallel)
    # --------------------------------------------------
    - run_models_parallel:
        parallel:
          shared: [project_id, region, date_key, bucket]
          branches:
            - clip_branch:
                steps:
                  - run_clip:
                      try:
                        call: googleapis.run.v2.projects.locations.jobs.run
                        args:
                          name: '${"projects/" + project_id + "/locations/" + region + "/jobs/recs-clip"}'
                          body:
                            overrides:
                              containerOverrides:
                                - args:
                                    - "--step=clip"
                                    - '${"--date-key=" + date_key}'
                                    - '${"--project=" + project_id}'
                        result: clip_result
                      except:
                        as: e
                        steps:
                          - log_clip_fail:
                              call: sys.log
                              args:
                                data: '${"CLIP failed: " + json.encode_to_string(e)}'
                                severity: "ERROR"
                          - raise_clip:
                              raise: '${e}'

            - svd_branch:
                steps:
                  - run_svd:
                      try:
                        call: googleapis.run.v2.projects.locations.jobs.run
                        args:
                          name: '${"projects/" + project_id + "/locations/" + region + "/jobs/recs-svd"}'
                          body:
                            overrides:
                              containerOverrides:
                                - args:
                                    - "--step=svd"
                                    - '${"--date-key=" + date_key}'
                                    - '${"--project=" + project_id}'
                                    - '${"--bucket=" + bucket}'
                        result: svd_result
                      except:
                        as: e
                        steps:
                          - log_svd_fail:
                              call: sys.log
                              args:
                                data: '${"SVD failed: " + json.encode_to_string(e)}'
                                severity: "ERROR"
                          - raise_svd:
                              raise: '${e}'

            - knn_branch:
                steps:
                  - run_knn:
                      try:
                        call: googleapis.run.v2.projects.locations.jobs.run
                        args:
                          name: '${"projects/" + project_id + "/locations/" + region + "/jobs/recs-knn"}'
                          body:
                            overrides:
                              containerOverrides:
                                - args:
                                    - "--step=knn"
                                    - '${"--date-key=" + date_key}'
                                    - '${"--project=" + project_id}'
                                    - '${"--bucket=" + bucket}'
                        result: knn_result
                      except:
                        as: e
                        steps:
                          - log_knn_fail:
                              call: sys.log
                              args:
                                data: '${"KNN failed: " + json.encode_to_string(e)}'
                                severity: "ERROR"
                          - raise_knn:
                              raise: '${e}'

    - log_models_done:
        call: sys.log
        args:
          data: "All model jobs completed (clip, svd, knn)"
          severity: "INFO"

    # --------------------------------------------------
    # 3. RRF merge
    # --------------------------------------------------
    - run_rrf:
        try:
          call: googleapis.run.v2.projects.locations.jobs.run
          args:
            name: '${"projects/" + project_id + "/locations/" + region + "/jobs/recs-rrf"}'
            body:
              overrides:
                containerOverrides:
                  - args:
                      - "--step=rrf"
                      - '${"--date-key=" + date_key}'
                      - '${"--project=" + project_id}'
          result: rrf_result
        except:
          as: e
          steps:
            - log_rrf_fail:
                call: sys.log
                args:
                  data: '${"RRF failed: " + json.encode_to_string(e)}'
                  severity: "ERROR"
            - raise_rrf:
                raise: '${e}'

    - log_rrf_done:
        call: sys.log
        args:
          data: "RRF merge completed"
          severity: "INFO"

    # --------------------------------------------------
    # 4. Verify
    # --------------------------------------------------
    - run_verify:
        try:
          call: googleapis.run.v2.projects.locations.jobs.run
          args:
            name: '${"projects/" + project_id + "/locations/" + region + "/jobs/recs-verify"}'
            body:
              overrides:
                containerOverrides:
                  - args:
                      - "--step=verify"
                      - '${"--date-key=" + date_key}'
                      - '${"--project=" + project_id}'
          result: verify_result
        except:
          as: e
          steps:
            - log_verify_fail:
                call: sys.log
                args:
                  data: '${"Verify failed (non-fatal): " + json.encode_to_string(e)}'
                  severity: "WARNING"

    # --------------------------------------------------
    # 5. 3:3 season meeting recommendation pipeline
    # --------------------------------------------------
    - run_meeting_group_index:
        try:
          call: googleapis.run.v2.projects.locations.jobs.run
          args:
            name: '${"projects/" + project_id + "/locations/" + region + "/jobs/recs-meeting-group-index"}'
            body:
              overrides:
                containerOverrides:
                  - args:
                      - "--step=meeting-group-index"
                      - '${"--date-key=" + date_key}'
                      - '${"--project=" + project_id}'
          result: meeting_group_index_result
        except:
          as: e
          steps:
            - log_meeting_group_index_fail:
                call: sys.log
                args:
                  data: '${"Meeting group index failed: " + json.encode_to_string(e)}'
                  severity: "ERROR"
            - raise_meeting_group_index:
                raise: '${e}'

    - run_meeting_recommend:
        try:
          call: googleapis.run.v2.projects.locations.jobs.run
          args:
            name: '${"projects/" + project_id + "/locations/" + region + "/jobs/recs-meeting-recommend"}'
            body:
              overrides:
                containerOverrides:
                  - args:
                      - "--step=meeting-recommend"
                      - '${"--date-key=" + date_key}'
                      - '${"--project=" + project_id}'
          result: meeting_recommend_result
        except:
          as: e
          steps:
            - log_meeting_recommend_fail:
                call: sys.log
                args:
                  data: '${"Meeting recommend failed: " + json.encode_to_string(e)}'
                  severity: "ERROR"
            - raise_meeting_recommend:
                raise: '${e}'

    - run_meeting_daily:
        try:
          call: googleapis.run.v2.projects.locations.jobs.run
          args:
            name: '${"projects/" + project_id + "/locations/" + region + "/jobs/recs-meeting-daily"}'
            body:
              overrides:
                containerOverrides:
                  - args:
                      - "--step=meeting-daily"
                      - '${"--date-key=" + date_key}'
                      - '${"--project=" + project_id}'
          result: meeting_daily_result
        except:
          as: e
          steps:
            - log_meeting_daily_fail:
                call: sys.log
                args:
                  data: '${"Meeting daily failed: " + json.encode_to_string(e)}'
                  severity: "ERROR"
            - raise_meeting_daily:
                raise: '${e}'

    - run_meeting_verify:
        try:
          call: googleapis.run.v2.projects.locations.jobs.run
          args:
            name: '${"projects/" + project_id + "/locations/" + region + "/jobs/recs-meeting-verify"}'
            body:
              overrides:
                containerOverrides:
                  - args:
                      - "--step=meeting-verify"
                      - '${"--date-key=" + date_key}'
                      - '${"--project=" + project_id}'
                      - "--write-meeting-verify-doc"
          result: meeting_verify_result
        except:
          as: e
          steps:
            - log_meeting_verify_fail:
                call: sys.log
                args:
                  data: '${"Meeting verify failed: " + json.encode_to_string(e)}'
                  severity: "ERROR"
            - raise_meeting_verify:
                raise: '${e}'

    # --------------------------------------------------
    # 6. Done
    # --------------------------------------------------
    - log_complete:
        call: sys.log
        args:
          data: '${"Pipeline completed for date_key=" + date_key}'
          severity: "INFO"

    - return_result:
        return:
          status: "completed"
          date_key: '${date_key}'
          project: '${project_id}'
